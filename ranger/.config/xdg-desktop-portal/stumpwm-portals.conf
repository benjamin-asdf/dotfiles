[preferred]
# XDG_CURRENT_DESKTOP=stumpwm has no matching *.portal (gtk.portal is
# UseIn=gnome). Pin the GTK backend explicitly so xdg-desktop-portal 1.18+
# doesn't depend on the deprecated implicit fallback. Note: gtk only
# implements FileChooser/Print/etc. — there is NO Screenshot backend for a
# bare X11 WM, which is why flameshot uses useX11LegacyScreenshot instead.
default=gtk
