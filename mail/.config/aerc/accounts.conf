# aerc accounts. Passwords come from pass, never from this file.

# benjamin@benjamin-schwerdtner.de (server: ~/repos/ftlm-mail)
[benjamin-schwerdtner.de]
source            = imaps://benjamin%40benjamin-schwerdtner.de@mail.benjamin-schwerdtner.de:993
source-cred-cmd   = pass show linode-mail-pw | head -n1
outgoing          = smtp://benjamin%40benjamin-schwerdtner.de@mail.benjamin-schwerdtner.de:587
outgoing-cred-cmd = pass show linode-mail-pw | head -n1
outgoing-cred-cmd-cache = true
from              = Benjamin Schwerdtner <benjamin@benjamin-schwerdtner.de>
default           = INBOX
copy-to           = Sent
archive           = Archive
postpone          = Drafts
